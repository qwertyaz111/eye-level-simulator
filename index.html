<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🕶目線差AR</title>
    <!-- Three.js 読み込み (WebXR対応バージョン) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --panel-width: 300px; }
        body { margin: 0; font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; background: #000; overflow: hidden; touch-action: none; }
        #ui-panel {
            position: absolute; top: 10px; left: 10px; width: var(--panel-width);
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            border-radius: 15px; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            max-height: calc(100vh - 40px); overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        @media screen and (max-width: 480px) { :root { --panel-width: 85vw; } }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        #toggle-text { font-size: 12px; font-weight: bold; color: #666; background: #eee; padding: 2px 8px; border-radius: 10px; }
        .collapsed #ui-content { display: none; }

        .app-title { font-size: 1.4rem; margin: 0; color: #333; text-align: center; font-weight: bold; flex-grow: 1; }
        .app-description { font-size: 11px; color: #777; margin-top: 8px; margin-bottom: 5px; line-height: 1.5; text-align: center; }
        
        .app-disclaimer { 
            font-size: 9px; color: #aaa; margin-bottom: 12px; line-height: 1.4; text-align: left;
            background: #f9f9f9; padding: 8px; border-radius: 8px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .group-b { background: #f0f7ff; border: 1px solid #d0e7ff; }
        .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        .section-header strong { font-size: 15px; color: #444; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; width: 100%; }
        .input-item { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .hint { font-size: 10px; color: #999; margin-bottom: 2px; font-weight: bold; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white; color: #333; width: 100%; box-sizing: border-box; }
        .color-picker { width: 100%; height: 38px; border: 2px solid #999; border-radius: 4px; cursor: pointer; padding: 0; background: none; appearance: none; -webkit-appearance: none; }
        
        .ar-btn { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; -webkit-tap-highlight-color: transparent; margin-bottom: 10px; }
        .ar-btn:active { background: #0056b3; transform: scale(0.98); }

        .share-btn { 
            width: 100%; padding: 12px; background: #000; color: white; border: none; border-radius: 10px; 
            font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none; margin-top: 10px;
        }
        .share-btn:active { transform: scale(0.98); opacity: 0.8; }

        .other-tools-link {
            margin-top: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 10px;
            text-align: center;
        }
        .other-tools-link a {
            text-decoration: none;
            color: #333;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid #333;
            padding: 8px 15px;
            border-radius: 30px;
            display: inline-block;
            transition: 0.3s;
            margin: 4px;
        }
        .other-tools-link a:hover {
            background: #333;
            color: #fff;
        }

        .usage-notes { font-size: 10px; color: #999; margin-top: 12px; line-height: 1.5; text-align: center; }

        .info-box { 
            background: #ffffff; padding: 15px; border-radius: 12px; margin-top: 12px; border: 1px solid #eee;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); display: none;
        }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
        #ar-loading { position: absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:white; background:rgba(0,0,0,0.8); padding:15px; border-radius:10px; display:none; z-index:200; font-size:14px; }
    </style>
</head>
<body>

<div id="ar-loading">📷 AR空間の起動中...</div>

<div id="ui-panel">
    <div class="panel-header" onclick="togglePanel()">
        <h1 class="app-title">🕶目線差AR</h1>
        <span id="toggle-text">閉じる</span>
    </div>

    <div id="ui-content">
        <p class="app-description">カメラをかざすと、現実空間に等身大のマネキンを出現させられます。Safari/Chrome推奨。</p>
        
        <div class="app-disclaimer">
            ※表示には誤差があります。ブラウザ上でのみ処理します。データがサーバーへ送信・保存されることはありません。
        </div>

        <div class="input-group group-b">
            <div class="section-header"><strong>マネキン</strong></div>
            <div class="input-row">
                <div class="input-item"><span class="hint">名前</span><input type="text" id="nameB" value="" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.6;"><span class="hint">性別</span><select id="genderB" onchange="updateScene()"><option value="male" selected>男</option><option value="female">女</option></select></div>
            </div>
            <div class="input-row">
                <div class="input-item"><span class="hint">身長 (cm)</span><input type="number" id="heightB" value="171.5" step="0.1" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.35;"><span class="hint">色</span><input type="color" id="colorB" class="color-picker" value="#ffad60" oninput="updateScene()"></div>
            </div>
        </div>

        <div style="padding: 0 5px;">
            <button class="ar-btn" onclick="startAR()">📷 AR機能を起動する</button>
        </div>
        
        <div id="info-container">
            <div class="info-box" id="info"></div>
            <button class="share-btn" onclick="shareToX()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>で結果をシェアする
            </button>

            <div class="other-tools-link">
                <p style="font-size: 10px; color: #888; margin-bottom: 8px;">こちらもチェック❣🤩</p>
                <a href="https://qwertyaz111.github.io/my-site-hub/">
                    ツール・シミュレーター一覧
                </a>
            </div>

            <div class="usage-notes">
                スクショ投稿や加工、トレース等はご自由にお楽しみください。<br>
                ※営利目的や商用利用は御遠慮ください。
            </div>
        </div>
    </div>
</div>

<div id="canvas-container"></div>

<script>
    let scene, camera, renderer, mannequinGroup, reticle;
    let xrHitTestSource = null;
    let xrRefSpace = null;
    let lastHitPose = null;

    function togglePanel() {
        const panel = document.getElementById('ui-panel');
        const text = document.getElementById('toggle-text');
        panel.classList.toggle('collapsed');
        text.innerText = panel.classList.contains('collapsed') ? '開く' : '閉じる';
    }

    function initStandard3D() {
        const container = document.getElementById('canvas-container');
        
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcccccc);
        
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 2); 
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbbb, 1.5);
        scene.add(light);

        const reticleGeo = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
        const reticleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
        reticle = new THREE.Mesh(reticleGeo, reticleMat);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        mannequinGroup = new THREE.Group();
        scene.add(mannequinGroup);

        window.addEventListener('resize', onWindowResize);
        
        updateScene();
        renderer.setAnimationLoop(animate);
    }

    function createUsdzArchive(usdaContent) {
        const encoder = new TextEncoder();
        const fileData = encoder.encode(usdaContent);
        const fileName = "model.usda";
        const nameData = encoder.encode(fileName);
        
        let crc = 0xFFFFFFFF;
        for (let i = 0; i < fileData.length; i++) {
            crc ^= fileData[i];
            for (let j = 0; j < 8; j++) {
                crc = (crc >>> 1) ^ (crc & 1 ? 0xEDB88320 : 0);
            }
        }
        crc = (crc ^ 0xFFFFFFFF) >>> 0;

        const size = fileData.length;
        const nameLen = nameData.length;
        
        const lfHeader = new Uint8Array(30 + nameLen);
        lfHeader.set([0x50, 0x4B, 0x03, 0x04, 10, 0, 0, 0, 0, 0, 0, 0, 0, 0]); 
        const dv = new DataView(lfHeader.buffer);
        dv.setUint32(14, crc, true);
        dv.setUint32(18, size, true);
        dv.setUint32(22, size, true);
        dv.setUint16(26, nameLen, true);
        lfHeader.set(nameData, 30);

        const cdHeader = new Uint8Array(46 + nameLen);
        cdHeader.set([0x50, 0x4B, 0x01, 0x02, 20, 0, 10, 0, 0, 0, 0, 0, 0, 0]);
        const cdDv = new DataView(cdHeader.buffer);
        cdDv.setUint32(16, crc, true);
        cdDv.setUint32(20, size, true);
        cdDv.setUint32(24, size, true);
        cdHeader.set(nameData, 46);

        const eocd = new Uint8Array(22);
        eocd.set([0x50, 0x4B, 0x05, 0x06, 0, 0, 0, 0, 1, 0, 1, 0]);
        const eocdDv = new DataView(eocd.buffer);
        eocdDv.setUint32(12, cdHeader.length, true);
        eocdDv.setUint32(16, lfHeader.length + size, true);

        return new Blob([lfHeader, fileData, cdHeader, eocd], { type: 'model/usd' });
    }

    async function startAR() {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
            const hB = parseFloat(document.getElementById('heightB').value) || 171.5;
            const gB = document.getElementById('genderB').value;
            const cB = document.getElementById('colorB').value || "#ffad60";
            
            const r = parseInt(cB.slice(1,3), 16) / 255;
            const g = parseInt(cB.slice(3,5), 16) / 255;
            const b = parseInt(cB.slice(5,7), 16) / 255;
            
            const h = hB * 0.01;
            const headH_raw = h * 0.13;
            const scaleH = h * (h / (h + 0.3 * headH_raw));

            const headH = scaleH * 0.13;
            const neckH = scaleH * 0.05;
            const torsoH = scaleH * 0.37;
            const legH = scaleH * 0.45;
            const torsoW = (gB === 'male' ? 0.26 : 0.21) * (scaleH / 1.7);
            const neckW = headH * 0.3;
            const legW = torsoW * 0.4;
            const armW = torsoW * 0.3;
            const armH = scaleH * 0.38;
            
            const targetEyeRatio = (gB === 'male') ? 0.904 : 0.903;
            const targetEyeY = scaleH * targetEyeRatio;
            const eyeSize = headH * 0.12;

            const usdaContent = `#usda 1.0
(
    defaultPrim = "mannequin"
    metersPerUnit = 1
    upAxis = "Y"
)
def Xform "mannequin"
{
    def Cube "torso"
    {
        float3 xformOp:scale = (${torsoW * 0.5}, ${torsoH * 0.5}, ${torsoW * 0.25})
        double3 xformOp:translate = (0, ${legH + (torsoH * 0.5)}, 0)
        uniform token[] xformOpOrder = ["xformOp:translate", "xformOp:scale"]
        color3f[] primvars:displayColor = [(${r}, ${g}, ${b})]
    }
    def Cylinder "neck"
    {
        uniform token axis = "Y"
        double radius = ${neckW}
        double height = ${neckH}
        double3 xformOp:translate = (0, ${scaleH - headH - (neckH * 0.5)}, 0)
        uniform token[] xformOpOrder = ["xformOp:translate"]
        color3f[] primvars:displayColor = [(${r}, ${g}, ${b})]
    }
    def Xform "headGroup"
    {
        double3 xformOp:translate = (0, ${targetEyeY}, 0)
        uniform token[] xformOpOrder = ["xformOp:translate"]
        
        def Sphere "head"
        {
            double radius = ${headH * 0.8}
            double3 xformOp:translate = (0, ${(scaleH - headH * 0.5) - targetEyeY}, 0)
            uniform token[] xformOpOrder = ["xformOp:translate"]
            color3f[] primvars:displayColor = [(${r}, ${g}, ${b})]
        }
        def Sphere "left_eye"
        {
            double radius = ${eyeSize}
            double3 xformOp:translate = (${-headH * 0.28}, 0, ${headH * 0.7})
            uniform token[] xformOpOrder = ["xformOp:translate"]
            color3f[] primvars:displayColor = [(0.13, 0.13, 0.13)]
        }
        def Sphere "right_eye"
        {
            double radius = ${eyeSize}
            double3 xformOp:translate = (${headH * 0.28}, 0, ${headH * 0.7})
            uniform token[] xformOpOrder = ["xformOp:translate"]
            color3f[] primvars:displayColor = [(0.13, 0.13, 0.13)]
        }
    }
    def Cube "left_leg"
    {
        float3 xformOp:scale = (${legW * 0.5}, ${legH * 0.5}, ${legW * 0.5})
        double3 xformOp:translate = (${-torsoW * 0.25}, ${legH * 0.5}, 0)
        uniform token[] xformOpOrder = ["xformOp:translate", "xformOp:scale"]
        color3f[] primvars:displayColor = [(${r}, ${g}, ${b})]
    }
    def Cube "right_leg"
    {
        float3 xformOp:scale = (${legW * 0.5}, ${legH * 0.5}, ${legW * 0.5})
        double3 xformOp:translate = (${torsoW * 0.25}, ${legH * 0.5}, 0)
        uniform token[] xformOpOrder = ["xformOp:translate", "xformOp:scale"]
        color3f[] primvars:displayColor = [(${r}, ${g}, ${b})]
    }
    def Xform "left_arm_group"
    {
        double3 xformOp:translate = (${-torsoW * 0.6}, ${legH + torsoH - (armW * 0.5)}, 0)
        float3 xformOp:rotateXYZ = (0, 0, -14.3)
        uniform token[] xformOpOrder = ["xformOp:translate", "xformOp:rotateXYZ"]
        def Cube "left_arm"
        {
            float3 xformOp:scale = (${armW * 0.5}, ${armH * 0.5}, ${armW * 0.5})
            double3 xformOp:translate = (0, ${-armH * 0.5}, 0)
            uniform token[] xformOpOrder = ["xformOp:translate", "xformOp:scale"]
            color3f[] primvars:displayColor = [(${r}, ${g}, ${b})]
        }
    }
    def Xform "right_arm_group"
    {
        double3 xformOp:translate = (${torsoW * 0.6}, ${legH + torsoH - (armW * 0.5)}, 0)
        float3 xformOp:rotateXYZ = (0, 0, 14.3)
        uniform token[] xformOpOrder = ["xformOp:translate", "xformOp:rotateXYZ"]
        def Cube "right_arm"
        {
            float3 xformOp:scale = (${armW * 0.5}, ${armH * 0.5}, ${armW * 0.5})
            double3 xformOp:translate = (0, ${-armH * 0.5}, 0)
            uniform token[] xformOpOrder = ["xformOp:translate", "xformOp:scale"]
            color3f[] primvars:displayColor = [(${r}, ${g}, ${b})]
        }
    }
}`;

            const zipBlob = createUsdzArchive(usdaContent);
            const url = URL.createObjectURL(zipBlob);
            
            const a = document.createElement('a');
            a.setAttribute('rel', 'ar');
            const img = document.createElement('img');
            a.appendChild(img);
            a.setAttribute('href', url + '#allowsContentScaling=0');
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 2000);
            return;
        }

        if ('xr' in navigator) {
            const loading = document.getElementById('ar-loading');
            loading.style.display = 'block';

            try {
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local-floor'],
                    optionalFeatures: ['hit-test']
                });

                renderer.xr.enabled = true;
                await renderer.xr.setSession(session);

                scene.background = null;
                loading.style.display = 'none';
                togglePanel();

                xrRefSpace = await session.requestReferenceSpace('local-floor');
                
                if (session.requestHitTestSource) {
                    const viewerSpace = await session.requestReferenceSpace('viewer');
                    xrHitTestSource = await session.requestHitTestSource({ space: viewerSpace });
                }

                session.addEventListener('select', onSelect);

                session.addEventListener('end', () => {
                    renderer.xr.enabled = false;
                    xrHitTestSource = null;
                    xrRefSpace = null;
                    lastHitPose = null;
                    reticle.visible = false;
                    scene.background = new THREE.Color(0xcccccc);
                });

                updateScene();
            } catch (e) {
                console.error(e);
                alert("ARの起動に失敗しました。WebXR対応ブラウザでご利用ください。");
                loading.style.display = 'none';
            }
        } else {
            alert("お使いのデバイス/ブラウザは空間配置AR（WebXR）に対応していません。iOSの場合はSafariより標準起動してください。");
        }
    }

    function onSelect() {
        if (reticle.visible && lastHitPose) {
            mannequinGroup.position.set(
                lastHitPose.transform.position.x,
                lastHitPose.transform.position.y,
                lastHitPose.transform.position.z
            );
        }
    }

    function createTextSprite(text, color, size = 60, isBold = false) {
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = 512; canvas.height = 128;
        context.font = `${isBold ? 'bold' : ''} ${size}px sans-serif`;
        context.fillStyle = color; context.textAlign = "center"; context.textBaseline = "middle";
        context.fillText(text, 256, 64);
        const texture = new THREE.CanvasTexture(canvas);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
        sprite.scale.set(1.5, 0.38, 1);
        return sprite;
    }

    function updateScene() {
        if (!mannequinGroup) return;

        const inputName = document.getElementById('nameB').value;
        const nB = inputName || "マネキン";
        const hB = parseFloat(document.getElementById('heightB').value) || 171.5;
        const gB = document.getElementById('genderB').value;
        const cB = document.getElementById('colorB').value || "#ffad60";

        while(mannequinGroup.children.length > 0) {
            const child = mannequinGroup.children[0];
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
            mannequinGroup.remove(child);
        }

        const h = hB * 0.01;
        const headH_raw = h * 0.13;
        const scaleH = h * (h / (h + 0.3 * headH_raw));

        // 修正点: bodyMat / eyeMat を正しく定義
        const bodyMat = new THREE.MeshPhongMaterial({ color: cB, transparent: true, opacity: 0.85 });
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });

        const headH = scaleH * 0.13;
        const neckH = scaleH * 0.05;
        const torsoH = scaleH * 0.37;
        const legH = scaleH * 0.45;
        
        const targetEyeRatio = (gB === 'male') ? 0.904 : 0.903;
        const targetEyeY = scaleH * targetEyeRatio;

        const headGroup = new THREE.Group();
        headGroup.name = "headGroup";
        headGroup.position.y = targetEyeY; 
        mannequinGroup.add(headGroup);

        const headGeo = new THREE.SphereGeometry(headH * 0.8, 16, 16);
        const head = new THREE.Mesh(headGeo, bodyMat);
        head.position.set(0, (scaleH - headH * 0.5) - targetEyeY, 0);
        headGroup.add(head);

        const eyeSize = headH * 0.12;
        [-1, 1].forEach(side => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(eyeSize, 16, 16), eyeMat);
            eye.position.set(side * (headH * 0.28), 0, (headH * 0.7));
            headGroup.add(eye);
        });

        const neckW = headH * 0.3;
        const neckGeo = new THREE.CylinderGeometry(neckW, neckW, neckH, 16);
        const neck = new THREE.Mesh(neckGeo, bodyMat);
        neck.position.y = scaleH - headH - (neckH * 0.5);
        mannequinGroup.add(neck);

        const torsoW = (gB === 'male' ? 0.26 : 0.21) * (scaleH / 1.7);
        const torsoGeo = new THREE.BoxGeometry(torsoW, torsoH, torsoW * 0.5);
        const torso = new THREE.Mesh(torsoGeo, bodyMat);
        torso.position.y = legH + (torsoH * 0.5);
        mannequinGroup.add(torso);

        const legW = torsoW * 0.4;
        const legGeo = new THREE.BoxGeometry(legW, legH, legW);
        [-1, 1].forEach(side => {
            const leg = new THREE.Mesh(legGeo, bodyMat);
            leg.position.set(side * (torsoW * 0.25), legH * 0.5, 0);
            mannequinGroup.add(leg);
        });

        const armW = torsoW * 0.3;
        const armH = scaleH * 0.38;
        const armGeo = new THREE.BoxGeometry(armW, armH, armW);
        [-1, 1].forEach(side => {
            const armAnchor = new THREE.Group();
            armAnchor.position.set(side * (torsoW * 0.6), legH + torsoH - (armW * 0.5), 0);
            const armMesh = new THREE.Mesh(armGeo, bodyMat);
            armMesh.position.set(0, -armH * 0.5, 0);
            armAnchor.rotation.z = side * 0.25;
            armAnchor.add(armMesh);
            mannequinGroup.add(armAnchor);
        });

        const displayName = `${nB} (${hB.toFixed(1)}cm)`;
        const nameLabel = createTextSprite(displayName, "#fff", 45, true);
        nameLabel.position.set(0, h + 0.2, 0);
        mannequinGroup.add(nameLabel);

        if (!renderer || !renderer.xr.enabled) {
            mannequinGroup.position.set(0, 0, -1.0);
        }
    }

    function shareToX() {
        const inputName = document.getElementById('nameB').value;
        const hB = parseFloat(document.getElementById('heightB').value) || 171.5;
        const text = inputName 
            ? `${inputName}(${hB}cm)のサイズ感をARで体感しました！\n#目線差AR\n`
            : `マネキン(${hB}cm)のサイズ感をARで体感しました！\n#目線差AR\n`;
        const url = window.location.href;
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
    }

    function onWindowResize() {
        if (renderer.xr.enabled) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(timestamp, frame) {
        if (frame && xrHitTestSource && xrRefSpace) {
            const hitTestResults = frame.getHitTestResults(xrHitTestSource);
            if (hitTestResults.length > 0) {
                const hit = hitTestResults[0];
                const pose = hit.getPose(xrRefSpace);
                if (pose) {
                    lastHitPose = pose;
                    reticle.visible = true;
                    reticle.matrix.fromArray(pose.transform.matrix);
                }
            } else {
                reticle.visible = false;
            }
        }

        if (mannequinGroup && camera) {
            mannequinGroup.children.forEach(child => {
                if(child instanceof THREE.Sprite) {
                    child.lookAt(camera.position.x, child.position.y, camera.position.z);
                }
                if(child.name === "headGroup") {
                    const targetPos = new THREE.Vector3();
                    camera.getWorldPosition(targetPos);
                    child.lookAt(targetPos);
                }
            });
        }
        renderer.render(scene, camera);
    }

    window.onload = () => {
        initStandard3D();
    };
</script>
</body>
</html>
